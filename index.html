            historyList: [],

        const categoryGlows = { eat: "rgba(255, 0, 60, 0.15)", fun: "rgba(255, 182, 193, 0.15)", watch: "rgba(255, 77, 121, 0.15)", message: "rgba(255, 228, 225, 0.15)", ironic: "rgba(255, 255, 255, 0.15)", motivational: "rgba(96, 165, 250, 0.15)" };
        let buttonTimeouts = {};

        // --- 2. სისტემის ინიციალიზაცია (LocalStorage Error Handling-ით) ---
        function initSystem() {
            const todayDate = new Date();
            const todayStr = todayDate.toDateString();
            const yesterdayDate = new Date();
            yesterdayDate.setDate(yesterdayDate.getDate() - 1);
            const yesterdayStr = yesterdayDate.toDateString();

            let streak = 0;
            let justIncreased = false;

            try {
                let lastVisit = localStorage.getItem('ri_lastVisit');
                streak = parseInt(localStorage.getItem('ri_streak')) || 0;

                if (lastVisit === todayStr) {
                    // უკვე იყო დღეს შემოული
                } else if (lastVisit === yesterdayStr) {
                    streak++;
                    justIncreased = true;
                } else {
                    streak = 1;
                    justIncreased = true;
                }

                localStorage.setItem('ri_lastVisit', todayStr);
                localStorage.setItem('ri_streak', streak.toString());
            } catch (e) {
                console.warn("LocalStorage is blocked by the browser setting. Streak won't be saved.");
                streak = 1;
            }

            const streakCountEl = document.getElementById('streak-count');
            const streakIconEl = document.getElementById('streak-icon');
            streakCountEl.innerText = streak;

            if (streak >= 3) {
                streakIconEl.classList.remove('text-rosegold/80');
                streakIconEl.classList.add('text-orange-500', 'animate-pulse');
                document.getElementById('streak-widget').style.boxShadow = '0 0 20px rgba(255, 165, 0, 0.25)';
                streakCountEl.classList.add('text-orange-400');
                streakCountEl.classList.remove('text-rosegold');
            }
            if (justIncreased) {
                setTimeout(() => {
                    streakCountEl.classList.add('streak-pop');
                    setTimeout(() => streakCountEl.classList.remove('streak-pop'), 600);
                }, 500);
            }
        }

        window.addEventListener('DOMContentLoaded', initSystem);

                { text: "იუთუბში ჩაწერე 'Things that shouldn't exist' და გაერკვიე სამყაროს შეცდომებში 🧩", icon: "fa-puzzle-piece", color: "text-orange-400", type: "watch", id: "w30" },
                { text: "იუთუბზე მოძებნე 'Oddly satisfying videos', გათიშე ტვინი და უბრალოდ უყურე როგორ ჭრიან საპნებს 🧼", icon: "fa-soap", color: "text-pink-300", type: "watch", id: "w31" },
                { text: "იუთუბზე ჩაწერე 'Most isolated places on earth' და ნახე, როგორ ცხოვრობს ხალხი შუაგულ არაფერში 🏔️", icon: "fa-mountain", color: "text-slate-300", type: "watch", id: "w32" },
                { text: "იუთუბში მოძებნე 'AI generated commercials'. მოემზადე ყველაზე უცნაური და საშიში სიზმრისთვის 🤖", icon: "fa-brain", color: "text-green-400", type: "watch", id: "w33" },
                { text: "იუთუბზე ჩაწერე 'Timelapse of the entire universe'. 10 წუთში ნახავ სამყაროს დასაწყისს და დასასრულს ⏳", icon: "fa-hourglass-half", color: "text-yellow-200", type: "watch", id: "w34" }
            ],
            message: [
                { text: '"რას შვრები, ხო ხარ ცოცხალი?" 👀', icon: "fa-mobile-screen", color: "text-sky-400", type: "message", id: "m1" },
                { text: '"გამოდი, რამე ვქნათ!" 🏃‍♂️', icon: "fa-person-running", color: "text-emerald-400", type: "message", id: "m2" },
                { text: '"მაგრად მომენატრე!" ❤️', icon: "fa-heart", color: "text-red-500", type: "message", id: "m3" },
                { text: '"ახლა სადაც ხარ, ფოტო გამომიგზავნე" 📸', icon: "fa-camera", color: "text-cyan-400", type: "message", id: "m4" },
                { text: '"მზად იყავი, 1 საათში გამოგივლი" 🚗', icon: "fa-car", color: "text-blue-400", type: "message", id: "m6" },
                { text: '"ჩემი ვალი გაქვს, გახსოვს?" 😂', icon: "fa-face-laugh-squint", color: "text-yellow-400", type: "message", id: "m8" },
                { text: '"თუ 10 წამში არ მიპასუხებ, შენი ტელეფონი აფეთქდება 💣"', icon: "fa-bomb", color: "text-red-600", type: "message", id: "m16" },
                { text: "მიწერე მწეველ მეგობარს და დაანებებინე სიგარეტს თავი! თუ გამოგივა, შეგიძლია იამაყო 🚭", icon: "fa-ban-smoking", color: "text-teal-400", type: "message", id: "m17" }
            ],
            motivational: [
                { text: "ეს საიტი 1 ღამეში AI-თ არის დამზადებული. ნუ გაჩერდები, შენც შეგიძლია შექმნა რაღაც! 🚀", icon: "fa-rocket", color: "text-blue-400", type: "motivational", id: "mot1" }
            ]
        };

        const ua = navigator.userAgent;
        let specificDeviceIdeas = [];

        if (/iPhone|iPad|iPod/i.test(ua)) {
            specificDeviceIdeas = [
                { text: "AirDrop-ით გაუგზავნე სასაცილო ფოტო ვინმე უცხოს კაფეში 😂", icon: "fa-wifi", color: "text-blue-400", type: "fun", id: "dev_i1" },
                { text: "Siri-ს კითხე რა გააკეთო დღეს და დაუჯერე 🤖", icon: "fa-microphone", color: "text-purple-400", type: "fun", id: "dev_i2" },
                { text: "შენი iPhone-ით გადაიღე 0.5x (ფართოკუთხიანი) ფოტო და გაუგზავნე მეგობარს 📸", icon: "fa-camera", color: "text-cyan-400", type: "fun", id: "dev_i3" },
                { text: "FaceTime-ით დაურეკე ვინმეს, ვისაც წლებია არ ლაპარაკებიხარ 📱", icon: "fa-video", color: "text-green-400", type: "message", id: "dev_i4" },
                { text: "გახსენი Apple Maps, დაადე თითი რუკას და წადი მანდ! 🗺️", icon: "fa-map-location-dot", color: "text-red-400", type: "fun", id: "dev_i5" },
                { text: "Find My-ში ნახე სად არიან შენი მეგობრები და მოულოდნელად დაადექი თავზე! 📍", icon: "fa-location-dot", color: "text-green-400", type: "fun", id: "dev_i6" },
                { text: "შენი iPhone-ის Notes-ში 100 დაუსრულებელი გეგმა გაქვს, ერთი მაინც შეასრულე! 📝", icon: "fa-note-sticky", color: "text-yellow-400", type: "fun", id: "dev_i7" }
            ];
        } else if (/Android/i.test(ua)) {
            specificDeviceIdeas = [
                { text: "დაუმტკიცე მეგობრებს, რომ შენი Android-ის კამერა ჯობია და წადით ფოტოების გადასაღებად 📸", icon: "fa-camera", color: "text-green-400", type: "fun", id: "dev_a1" },
                { text: "Google Assistant-ს თხოვე მოგიყვეს ანეკდოტი 🤖", icon: "fa-robot", color: "text-blue-400", type: "fun", id: "dev_a2" },
                { text: "შენი Android-ის ბატარეა კიდევ დიდხანს გაძლებს, რას ზიხარ სახლში?! გარეთ გადი! 🔋", icon: "fa-battery-full", color: "text-green-500", type: "fun", id: "dev_a3" },
                { text: "გახსენი Google Maps შენს Android-ზე, დაადე თითი რუკას და წადი მანდ! 🗺️", icon: "fa-map-location-dot", color: "text-red-400", type: "fun", id: "dev_a4" },
                { text: "Google Photos გაფრთხილებს რომ მეხსიერება ივსება... დაიკიდე, წადი და ახალი ფოტოები გადაიღე! ☁️", icon: "fa-cloud", color: "text-blue-300", type: "fun", id: "dev_a5" },
                { text: "Android-ის 'Back' ღილაკი ვერ გიშველის, უკვე აქ ხარ! ახლა გარეთ გასვლის დროა 🔙", icon: "fa-arrow-left", color: "text-rosegold", type: "fun", id: "dev_a6" },
                { text: "Google Maps-ში ნახე მეგობრების გაზიარებული ლოკაცია და მოულოდნელად დაადექი თავზე! 📍", icon: "fa-location-dot", color: "text-green-400", type: "fun", id: "dev_a7" }
            ];
        } else {
            specificDeviceIdeas = [
                { text: "Alt+Tab-ით გადმოხვედი სამსახურის/სკოლის საქმეებიდან ხომ? 👀 წადი, დაისვენე!", icon: "fa-laptop-code", color: "text-cyan-400", type: "fun", id: "dev_p1" },
                { text: "მთელი დღეა ეკრანს უყურებ... შეუკვეთე მაინც რამე გემრიელი! 🍕", icon: "fa-pizza-slice", color: "text-red-400", type: "eat", id: "dev_p2" },
                { text: "კლავიატურაზე ამდენ კაკუნს, წადი სადმე ბუნებაში გაისეირნე 🌳", icon: "fa-leaf", color: "text-green-400", type: "fun", id: "dev_p3" },
                { text: "მაუსის ტრიალს, მეგობრებს მიწერე და გარეთ გადი! 🖱️", icon: "fa-computer-mouse", color: "text-rosegold-light", type: "message", id: "dev_p4" },
                { text: "გაასწორე წელი! ეგ 50 ღია Chrome-ის ტაბი მიატოვე და გარეთ გადი 🪑", icon: "fa-chair", color: "text-yellow-400", type: "fun", id: "dev_p5" },
                { text: "Youtube-ზე ვიდეოების ყურებას, ჯობია მართლა წახვიდე და რამე გემრიელი შეჭამო! 🍔", icon: "fa-burger", color: "text-orange-400", type: "eat", id: "dev_p6" }
            ];
        }

        ideas.fun.push(...specificDeviceIdeas.filter(i => i.type === 'fun'));
        ideas.eat.push(...specificDeviceIdeas.filter(i => i.type === 'eat'));
        ideas.message.push(...specificDeviceIdeas.filter(i => i.type === 'message'));

        const timeBasedIdeas = [
            { condition: (h, cat) => (h >= 1 && h <= 5) && (cat === 'eat' || cat === 'all'), generate: (h) => ({ text: `ღამის ${h} საათია... მაცივრის კარის ჭრიალს მთელი კორპუსი გაიგებს! 🤫`, icon: "fa-user-secret", color: "text-slate-400", type: "eat", id: "t_e1" }) },
            { condition: (h, cat) => (h >= 1 && h <= 5) && (cat === 'message' || cat === 'all'), generate: (h) => ({ text: `"გღვიძავს?" - კლასიკური შეცდომა ღამის ${h} საათზე... გაუშვი! 📱`, icon: "fa-moon", color: "text-rosegold", type: "message", id: "t_m1" }) }
        ];

        // --- 4. ძირითადი ფუნქციები ---
        function setCategory(category) {
            if(appState.isGenerating) return; 
            appState.currentCategory = category;
            
            document.querySelectorAll('.neon-tab').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${category}`).classList.add('active');
        }

        function getRandomIdea() {
            if (appState.clickCounter === 15) return { text: "უკვე 15 იდეა გამოტოვე... მგონი სახლში დარჩენა გირჩევნია 🏠", icon: "fa-couch", color: "text-slate-400", type: "ironic", id: "ir1" };
            if (appState.clickCounter === 25) return { text: "სანამ შენ აქ აკლიკებ, სხვები უკვე ხინკალს ჭამენ 🥟", icon: "fa-face-rolling-eyes", color: "text-rosegold-light", type: "ironic", id: "ir3" };
            if (appState.clickCounter === 40) return { text: "ამხელა დიზაინი იმისთვის არ შეგვიქმნია, რომ უსასრულოდ აკლიკო... 🥂", icon: "fa-champagne-glasses", color: "text-rosegold", type: "ironic", id: "ir4" };

            const currentHour = new Date().getHours();
            if (Math.random() < 0.3) {
                const validTimeIdeas = timeBasedIdeas.filter(rule => rule.condition(currentHour, appState.currentCategory));
                if (validTimeIdeas.length > 0) {
                    const timeIdea = validTimeIdeas[Math.floor(Math.random() * validTimeIdeas.length)].generate(currentHour);
                    if (!appState.historyList.includes(timeIdea.id)) { 
                        appState.historyList.push(timeIdea.id); 
                        return timeIdea; 
                    }
                }
            }

            let pool = [];
            if (appState.currentCategory === 'all') {
                pool = [...ideas.eat, ...ideas.fun, ...ideas.watch, ...ideas.message, ...ideas.motivational];
            } else {
                pool = ideas[appState.currentCategory];
            }

            let candidate; let attempts = 0;
            do { 
                candidate = pool[Math.floor(Math.random() * pool.length)]; 
                attempts++; 
            } while (appState.historyList.includes(candidate.id) && attempts < 50);
            
            appState.historyList.push(candidate.id); 
            if (appState.historyList.length > appState.MAX_HISTORY) appState.historyList.shift();
            
            return candidate;
        }

        function generateIdea() {
            if (appState.isGenerating) return; 
            appState.isGenerating = true; 
            appState.clickCounter++;

            const resultContainer = document.getElementById('result-container');
            const resultText = document.getElementById('result-text');
            const resultIcon = document.getElementById('result-icon');
            const iconWrapper = document.getElementById('icon-wrapper');
            const resultLabel = document.getElementById('result-label');
            const btn = document.getElementById('generate-btn');
            const copyBtn = document.getElementById('copy-btn');
            
            copyBtn.classList.remove('opacity-100', 'translate-y-0'); copyBtn.classList.add('opacity-0', 'translate-y-2');
            
            btn.innerHTML = `<span class="relative z-10 flex items-center justify-center drop-shadow-md">ვფიქრობ... <i class="fa-solid fa-spinner fa-spin ml-3 text-white" aria-hidden="true"></i></span>`;
            
            resultLabel.classList.remove('opacity-100'); resultLabel.classList.add('opacity-0');
            resultText.classList.remove('pop-in', 'text-white/95'); iconWrapper.classList.remove('pop-in');
            resultText.classList.add('text-crimson', 'rolling-text');
            resultIcon.className = 'fa-solid fa-sparkles text-5xl text-crimson/80 animate-spin';
            
            resultContainer.style.boxShadow = 'inset 0 0 40px rgba(255,0,60,0.1)';

            let counter = 0; const tempTexts = ["ბანქოს ვრევ...", "საათს ვამოწმებ...", "რამე იქნება...", "მზადაა..."];
            const spinInterval = setInterval(() => { 
                resultText.innerText = tempTexts[counter % tempTexts.length]; 
                counter++; 
            }, 180);

            setTimeout(() => {
                clearInterval(spinInterval);
                const finalIdea = getRandomIdea(); 
                appState.lastResultText = finalIdea.text;
                
                resultLabel.innerText = categoryLabels[finalIdea.type];
                resultLabel.classList.remove('opacity-0'); resultLabel.classList.add('opacity-100');
                
                resultText.classList.remove('rolling-text', 'text-crimson'); resultText.classList.add('text-white', 'pop-in');
                iconWrapper.classList.add('pop-in');
                
                resultText.innerText = finalIdea.text;
                resultIcon.className = `fa-solid ${finalIdea.icon} text-5xl md:text-7xl ${finalIdea.color} drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]`;
                resultContainer.style.boxShadow = `inset 0 0 80px ${categoryGlows[finalIdea.type]}, inset 0 0 0 1px rgba(255,182,193,0.15)`;

                setTimeout(() => {
                    copyBtn.classList.remove('opacity-0', 'translate-y-2'); copyBtn.classList.add('opacity-100', 'translate-y-0');
                }, 200);
                
                btn.innerHTML = `<span class="relative z-10 flex items-center justify-center drop-shadow-md">კიდევ ვცადოთ <i class="fa-solid fa-rotate-right ml-3 text-white" aria-hidden="true"></i></span>`;
                appState.isGenerating = false;
            }, 1200);
        }

        function copyResult() {
            if (!appState.lastResultText) return; 
            const textToCopy = appState.lastResultText.replace(/['"]/g, '');
            
            if(navigator.clipboard && window.isSecureContext) { 
                navigator.clipboard.writeText(textToCopy).then(() => { showButtonSuccess('copy-btn', 'fa-regular fa-copy'); });
            } else { 
                const tempInput = document.createElement('textarea'); 
                tempInput.value = textToCopy; 
                document.body.appendChild(tempInput); 
                tempInput.select(); 
                document.execCommand('copy'); 
                document.body.removeChild(tempInput); 
                showButtonSuccess('copy-btn', 'fa-regular fa-copy'); 
            }
        }

        function showButtonSuccess(btnId, originalIconClass) {
            const btn = document.getElementById(btnId); 
            if (buttonTimeouts[btnId]) clearTimeout(buttonTimeouts[btnId]);
            
            btn.innerHTML = '<i class="fa-solid fa-check text-green-400 text-base" aria-hidden="true"></i>'; 
            btn.classList.add('border-green-500/50');
            
            buttonTimeouts[btnId] = setTimeout(() => { 
                btn.innerHTML = `<i class="${originalIconClass}" aria-hidden="true"></i>`; 
                btn.classList.remove('border-green-500/50'); 
            }, 2000);
        }

        // --- Service Worker-ის რეგისტრაცია (PWA-სთვის) ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker დარეგისტრირდა წარმატებით!'))
                    .catch(err => console.log('Service Worker რეგისტრაციის შეცდომა:', err));
            });
        }
    </script>
</body>
</html>
