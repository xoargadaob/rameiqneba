<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    
    <title>რამეიქნება.გე - იდეების გენერატორი</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.web-fonts.ge/fonts/bpg-nateli/css/bpg-nateli.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #050505; color: white; overflow-x: hidden; font-family: 'BPG Nateli', sans-serif; }
        
        /* ოპტიმიზებული ფონი (FPS-ის გასაზრდელად) */
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at 20% 30%, #ff003c20 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, #ffb6c110 0%, transparent 50%);
            z-index: -1;
            contain: layout;
        }

        .glass-panel { 
            background: rgba(10, 10, 10, 0.7); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        .inner-screen { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05); }

        .neon-tab { color: rgba(255, 255, 255, 0.5); transition: 0.3s; cursor: pointer; }
        .neon-tab.active { color: #ffb6c1; border-bottom: 2px solid #ff003c; }
        
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 selection:bg-crimson">

    <div class="bg-mesh"></div>

    <main class="z-10 text-center w-full max-w-xl">
        <header class="mb-8">
            <h1 class="text-5xl md:text-7xl font-black uppercase tracking-tighter">
                <span class="text-white">რამე</span><span class="text-[#ffb6c1]">იქნება</span><span class="text-[#ff003c]/80 text-4xl">.გე</span>
            </h1>
        </header>

        <section class="glass-panel rounded-[2rem] p-6 md:p-10">
            <nav class="flex justify-center gap-6 mb-8 text-lg font-bold uppercase" aria-label="კატეგორიები">
                <button onclick="updateUI('all')" id="btn-all" class="neon-tab active">ყველა</button>
                <button onclick="updateUI('eat')" id="btn-eat" class="neon-tab">ჭამა</button>
                <button onclick="updateUI('fun')" id="btn-fun" class="neon-tab">გართობა</button>
            </nav>

            <div id="result-container" class="inner-screen rounded-2xl min-h-[14rem] flex flex-col items-center justify-center p-6 mb-8">
                <span id="result-text" class="text-xl md:text-2xl text-white/90 text-center">დააჭირე ღილაკს და გაიგე რა ვქნათ</span>
            </div>

            <button onclick="generateIdea()" class="w-full bg-[#ff003c] text-white font-bold py-4 rounded-xl hover:bg-rose-600 transition active:scale-95">
                რა ვქნათ დღეს?
            </button>
        </section>
    </main>

    <script>
        const state = { currentCategory: 'all' };
        const ideas = {
            eat: [{text: "პიცა 🍕"}, {text: "შაურმა 🌯"}, {text: "სუში 🍣"}, {text: "ხინკალი 🥟"}],
            fun: [{text: "ბოულინგი 🎳"}, {text: "გასეირნება 🚶"}, {text: "თამაში 🎮"}],
            motivational: [{text: "ეს საიტი AI-თ არის დამზადებული. შენც შეგიძლია შექმნა რაღაც! 🚀"}]
        };

        function updateUI(cat) {
            state.currentCategory = cat;
            document.querySelectorAll('.neon-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${cat}`).classList.add('active');
        }

        function generateIdea() {
            let pool = state.currentCategory === 'all' 
                ? [...ideas.eat, ...ideas.fun, ...ideas.motivational] 
                : ideas[state.currentCategory];
            
            const idea = pool[Math.floor(Math.random() * pool.length)];
            const textEl = document.getElementById('result-text');
            textEl.classList.remove('pop-in');
            void textEl.offsetWidth; // ანიმაციის გადატვირთვა
            textEl.innerText = idea.text;
            textEl.classList.add('pop-in');
        }

        // PWA რეგისტრაცია
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(console.error);
        }
    </script>
</body>
</html>
